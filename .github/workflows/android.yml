name: Android
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/AetherNav
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
      - name: Accept SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-cleanup: on-success
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: gradle testDebugUnitTest --no-daemon --stacktrace
      - run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethernav-debug-apk
          path: android/AetherNav/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethernav-test-reports
          path: android/AetherNav/app/build/test-results/**
          if-no-files-found: warn
